<!doctype html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F7F6F2">
  <title>Find Your Life | قۆناغی ناسین</title>
  <link rel="stylesheet" href="style.css?v=13">
</head>
<body>
  <svg class="icon-sprite" aria-hidden="true">
    <symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
    <symbol id="icon-shield" viewBox="0 0 24 24"><path d="M12 3 19 6v5c0 5-3.3 8.4-7 10-3.7-1.6-7-5-7-10V6l7-3Z"/><path d="M12 8v5m0 3h.01"/></symbol>
    <symbol id="icon-more" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="12" cy="19" r="1" fill="currentColor"/></symbol>
    <symbol id="icon-check" viewBox="0 0 24 24"><path d="m5 12 4.5 4.5L19 7"/></symbol>
  </svg>
  <div class="stage-shell">
    <header class="stage-header"><a class="detail-back" data-stage-back href="request-detail.html?id=r1" aria-label="گەڕانەوە بۆ داواکاری"><svg aria-hidden="true"><use href="#icon-arrow"/></svg><span>گەڕانەوە</span></a><div class="stage-title"><h1 data-stage-name>ئەحمەد</h1><p>قۆناغی ناسین</p></div><details class="header-safety" data-stage-safety><summary aria-label="سەلامەتی"><svg aria-hidden="true"><use href="#icon-more"/></svg></summary><div><button type="button" data-stage-safety-choice="end">کۆتایی پێهێنانی ناسین</button><button type="button" data-stage-safety-choice="block">بلۆککردن</button><button type="button" data-stage-safety-choice="report">ڕاپۆرتکردن</button></div></details></header>
    <main class="guided-page" data-guided-page>
      <p class="guided-intro">پێش ئەوەی بچنە گفتوگۆی سنووردار، چەند بابەتێکی گرنگ بە کورتی باس بکەن.</p>
      <form id="guidedForm" class="guided-form">
        <section class="guided-topic"><h2>چاوەڕوانییەکانی هاوسەرگیری</h2><label for="guided-expectations">چی بۆ ژیانێکی هاوبەش گرنگترە؟</label><textarea id="guided-expectations" rows="2" maxlength="160" required aria-describedby="guided-expectations-count"></textarea><p id="guided-expectations-count" class="character-count">0 / 160</p></section>
        <section class="guided-topic"><h2>خێزان و بەهاکان</h2><label for="guided-values">کام بەها لە پەیوەندییەکدا بۆت گرنگن؟</label><textarea id="guided-values" rows="2" maxlength="160" required aria-describedby="guided-values-count"></textarea><p id="guided-values-count" class="character-count">0 / 160</p></section>
        <section class="guided-topic"><h2>کار و پلانی داهاتوو</h2><label for="guided-future">پلانت بۆ شێوازی ژیان و داهاتوو چییە؟</label><textarea id="guided-future" rows="2" maxlength="160" required aria-describedby="guided-future-count"></textarea><p id="guided-future-count" class="character-count">0 / 160</p></section>
        <p class="stage-warning" data-stage-warning role="alert" hidden></p>
        <button class="button button-primary" type="submit">بەردەوامبوون بۆ گفتوگۆ</button>
      </form>
      <section class="stage-confirmation" data-stage-confirmation hidden><p data-stage-confirm-copy></p><div><button class="button button-primary" type="button" data-stage-confirm>بەڵێ، بەردەوام بە</button><button class="button button-secondary" type="button" data-stage-cancel>گەڕانەوە</button></div></section>
      <section class="stage-quiet-state quiet-closure-state" data-stage-quiet-state hidden tabindex="-1"><span class="success-mark" aria-hidden="true"><svg><use href="#icon-check"/></svg></span><h2 data-stage-quiet-title></h2><p data-stage-quiet-copy></p><a class="button button-secondary" data-stage-back href="request-detail.html?id=r1">گەڕانەوە بۆ داواکاری</a></section>
    </main>
  </div>
  <script src="safety.js?v=13"></script>
  <script src="conversation.js?v=13"></script>
</body>
</html>
